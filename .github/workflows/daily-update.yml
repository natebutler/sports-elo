name: Refresh Sports Elo

on:
  schedule:
    - cron: "0 10 * * *"
  workflow_dispatch:

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install dashboard dependencies
        run: pip install .
      - name: Run Elo tests
        run: python -m unittest discover -s tests -v
      - name: Incrementally refresh current-season data
        run: python -m sports_elo.update --season "$(date +%Y)"
      - name: Commit refreshed cache
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data
          git diff --cached --quiet || git commit -m "data: refresh Elo cache"
          git push
      - name: Generate static dashboard
        run: python -m sports_elo.build --season "$(date +%Y)" --output docs
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: docs
      - id: deployment
        uses: actions/deploy-pages@v4
